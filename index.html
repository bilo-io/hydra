<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hydra — Crypto Portfolio, Markets & Analytics</title>
    <meta
      name="description"
      content="Hydra unified crypto portfolio, market explorer, multi-asset trading desk, live statistics, news, and interactive chart analytics."
    />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:site_name" content="Hydra" />
    <meta property="og:title" content="Hydra — Crypto Portfolio, Markets & Analytics" />
    <meta
      property="og:description"
      content="Unified crypto portfolio, market explorer, multi-asset trading desk, live statistics, news, and chart analytics."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.jpg" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <!-- No-flash theme init: matches Midnite UI theme-script.ts ('midnite.theme') -->
    <script>
      (function () {
        try {
          var k = 'midnite.theme';
          var s = localStorage.getItem(k);
          var p = s === 'light' || s === 'dark' || s === 'time' ? s : 'system';
          var r;
          if (p === 'system') {
            r = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (p === 'time') {
            var h = new Date().getHours();
            r = h >= 8 && h < 18 ? 'light' : 'dark';
          } else {
            r = p;
          }
          var c = document.documentElement.classList;
          if (r === 'dark') c.add('dark');
          else c.remove('dark');
          document.documentElement.style.colorScheme = r;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
